name: Feature request
description: Propose a focused improvement within the Git'o product contract.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest behavior that would solve it.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Contract check
      options:
        - label: This does not require a Git'o account, backend, telemetry, or provider write operation.
          required: true
        - label: This is scoped to VS Code desktop or a remote Extension Host.
          required: true
