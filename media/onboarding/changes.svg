<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Changes and commit onboarding</title>
  <desc id="description">A Git'o Changes view with a commit message, commit button, staged files, and conflict guidance.</desc>
  <style>
    .canvas{fill:var(--vscode-editor-background,#1f2428)}.panel{fill:var(--vscode-sideBar-background,#252a2e);stroke:var(--vscode-widget-border,#4b5359)}.input{fill:var(--vscode-input-background,#30363b);stroke:var(--vscode-input-border,#59636a)}.button{fill:var(--vscode-button-background,#6b865e)}.buttonText{fill:var(--vscode-button-foreground,#fff);font-weight:650}.row{fill:var(--vscode-list-hoverBackground,#30363b)}.text{fill:var(--vscode-foreground,#d9d9d9);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:18px;font-weight:650}.muted{fill:var(--vscode-descriptionForeground,#a6adb2);font-size:13px}.added{fill:var(--vscode-gitDecoration-addedResourceForeground,#89b482)}.modified{fill:var(--vscode-gitDecoration-modifiedResourceForeground,#e2b86b)}.conflict{fill:var(--vscode-gitDecoration-conflictingResourceForeground,#ea6962)}.accent{fill:none;stroke:var(--vscode-focusBorder,#88b8f6);stroke-width:2}
  </style>
  <rect class="canvas" width="640" height="360" rx="16"/>
  <rect class="panel" x="45" y="28" width="550" height="304" rx="12"/>
  <text class="text title" x="70" y="62">Changes</text>
  <rect class="input" x="70" y="80" width="500" height="58" rx="7"/>
  <text class="text" x="88" y="113">feat: add export workflow</text>
  <text class="text muted" x="526" y="130">25/50</text>
  <rect class="button" x="70" y="150" width="500" height="42" rx="7"/>
  <text class="text buttonText" x="286" y="177">✓ Commit</text>
  <text class="text title" x="70" y="224">Staged Changes</text>
  <text class="text muted" x="530" y="224">2</text>
  <rect class="row" x="70" y="238" width="500" height="34" rx="6"/>
  <circle class="added" cx="90" cy="255" r="6"/><text class="text" x="108" y="260">src/export.ts</text><text class="text muted" x="506" y="260">Added</text>
  <rect class="row" x="70" y="280" width="320" height="34" rx="6"/>
  <circle class="modified" cx="90" cy="297" r="6"/><text class="text" x="108" y="302">README.md</text><text class="text muted" x="304" y="302">Modified</text>
  <rect class="panel" x="408" y="280" width="162" height="34" rx="6"/>
  <circle class="conflict" cx="427" cy="297" r="6"/><text class="text muted" x="442" y="302">Conflict guide ready</text>
  <rect class="accent" x="70" y="80" width="500" height="58" rx="7"/>
</svg>
